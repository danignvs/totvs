<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Horas</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Ajustes específicos de layout para esta tela (Sempre em coluna) */
        .container {
            display: flex !important;
            flex-direction: column !important;
            gap: 20px; 
            width: 90%;
        }

        .container-formulario, .container-resultado { 
            width: 100%; 
            min-width: 300px;
        }

        /* Container Principal Expansível */
        #containerPrincipal {
            margin: 0 auto;
            transition: max-width 0.3s ease;
        }

        .resultado {
            background-color: var(--branco);
        }

        /* --- ESTILOS EXCLUSIVOS DO CALENDÁRIO --- */
        .calendario-wrapper {
            background-color: var(--cinza-claro);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--cinza);
        }

        .calendario-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            font-weight: bold; 
            color: var(--az-escuro); 
            width: 100%;
            max-width: 270px;
            margin: 0 auto; 
            padding: 0 0 20px 0; 
        }

        .calendario-header button { 
            width: auto; 
            padding: 5px 15px; 
            font-size: 1.2em; 
            background: transparent; 
            color: var(--az-claro); 
            border: none;
            cursor: pointer;
        }

        .calendario-header button:hover { 
            background: rgba(0, 219, 255, 0.1); 
        }

        /* --- LAYOUT DUPLO MESES --- */
        .calendarios-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mes-wrapper {
            flex: 1;
            min-width: 250px;
        }

        .mes-titulo {
            text-align: center;
            font-weight: bold;
            color: var(--roxo);
            margin-bottom: 10px;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        
        .calendario-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 5px; 
            font-size: 0.85em; 
        }

        .cal-dias-semana { display: contents; }
        
        .cal-dias-semana div { 
            text-align: center; 
            font-weight: bold; 
            color: var(--roxo); 
            padding-bottom: 5px; 
            border-bottom: 2px solid var(--roxo); 
            margin-bottom: 5px; 
        }

        .cal-dia { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border-radius: 3px; 
            padding: 5px 2px; 
            min-height: 45px; 
            justify-content: space-between; 
        }

        .cal-dia.fora-mes { border: none; background: transparent; }
        .cal-dia.descanso { background-color: var(--cinza); opacity: 0.6; }
        .cal-dia.fora-periodo { opacity: 0.3; background: var(--cinza); border: 1px solid #aaa; }
        
        .cal-dia input { 
            width: 80%; 
            padding: 4px 2px; 
            text-align: center; 
            margin: 0; 
            border: 1px solid var(--az-claro); 
            border-radius: 3px; 
            font-size: 0.9em; 
            font-weight: bold; 
        }

        .cal-dia input:disabled { display: none; }
        
        .cal-dia.descanso.preenchido input { 
            background-color: #fff4e5 !important; 
            border-color: var(--laranja) !important; 
            color: var(--laranja) !important; 
        }

        /* --- MENSAGENS E CONTADOR --- */
        #containerDicas {
            min-height: 20px;
            margin-top: 15px;
        }

        .aviso-feriado { 
            color: var(--laranja); 
            font-weight: bold; 
            font-size: 0.85em; 
            text-align: center; 
            animation: fadeIn 0.3s; 
        }

        #previewTotalHoras { 
            text-align: center; 
            margin-top: 15px; 
            font-size: 1.2em;
            transition: color 0.3s ease;
        }

        /* --- ÁREA DE TEXTO COPIAR --- */
        .bloco-resultado-texto {
            margin-top: 30px;
            border-top: 1px dashed var(--cinza);
            padding-top: 20px;
        }

        .topo-resultado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .topo-resultado label {
            font-weight: bold;
            color: var(--az-escuro);
        }

        /* RESPONSIVIDADE PARA DOIS MESES */
        @media (min-width: 700px) {
            #containerPrincipal {
                max-width: 850px;
            }
            .calendarios-container {
                flex-direction: row;
                justify-content: space-between; 
                gap: 80px; 
            }
            .mes-proximo {
                display: block;
            }
            .calendario-header {
                max-width: 500px;
            }
        }

        @media (max-width: 700px) {
            .mes-proximo {
                display: none;
            }
            .container {
                width: 94%;
            }
        }

        @media (max-width: 800px) {
            .container {
                width: 94%;
            }
        }
        
    </style>
</head>
<body>

    <h1><strong class="azul-claro">Calculadora</strong> de Horas</h1>

    <div class="container container-azul" id="containerPrincipal">
        
        <section class="container-formulario" style="width: 100%;">        

            <div class="input-group">
                <div class="input-item custom-date-wrapper">
                    <label for="txtHoras"></label>
                    <input type="text" id="txtHoras" placeholder="Total de Horas" oninput="gerarDistribuicao()">
                </div>
                <div class="input-item custom-date-wrapper">
                    <label for="txtInicio"></label>
                    <input type="text" id="txtInicio" class="inp-date-text" placeholder="Início" maxlength="10" oninput="mascaraData(this)">
                    <span class="calendar-icon">📅</span>
                    <input type="date" id="pickerInicio" class="inp-date-picker" onchange="atualizarDataPicker(this, 'txtInicio')">
                </div>
                <div class="input-item custom-date-wrapper">
                    <label for="txtFim"></label>
                    <input type="text" id="txtFim" class="inp-date-text" placeholder="Conclusão" maxlength="10" oninput="mascaraData(this)">
                    <span class="calendar-icon">📅</span>
                    <input type="date" id="pickerFim" class="inp-date-picker" onchange="atualizarDataPicker(this, 'txtFim')">
                </div>
            
                <div class="input-item" style="flex: 0;">
                    <label></label>
                    <button class="btn-laranja btn-aux" onclick="limparCalendario()">Limpar</button> 
                </div>
            
            </div>

        </section>

        <section class="container-resultado">
            <div class="calendario-wrapper">
                <div class="calendario-header">
                    <button onclick="mudarMes(-1)">&#10094;</button>
                    <span id="calMesAno">MÊS ANO</span>
                    <button onclick="mudarMes(1)">&#10095;</button>
                </div>
                
                <div id="calendariosWrapper" class="calendarios-container"></div>
                
                <div id="containerDicas">
                    <div id="dicaTabModal" style="display:none; background-color: var(--limao); color: var(--az-escuro); font-size: 0.9em; text-align: center; padding: 8px; border-radius: 4px; font-weight: bold; animation: fadeIn 0.3s; margin-bottom: 5px;">
                        💡 Dica: Use a tecla TAB no teclado para pular de um dia para o outro!
                    </div>
                    <div id="avisoFeriadoModal" style="display:none;" class="aviso-feriado">
                        ⚠️ Atenção: horas lançadas em dias de descanso
                    </div>
                </div>
                
                <div id="previewTotalHoras"></div>

                <div class="bloco-resultado-texto">
                    <div class="topo">
                        <label>Planejamento Diário:</label>
                        <button class="btn-roxo btn-aux" onclick="copiarTabelaDetalhamento()">Copiar</button>
                    </div>

                    <div id="areaTabelaDetalhamento" class="tabela-container resultado">
                        <div class="mensagem-vazia">Preencha o calendário para gerar o detalhamento de horas...</div>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <div id="toast">Copiado!</div>

<script>
    let currentDate = new Date();
    let horasState = {};
    let dataInicioGlobal = null;
    let dataFimGlobal = null;

    let contadorCliquesHora = 0;
    let usouTabNesteModal = false;
    let ultimoInputClicado = -1;

    // --- TOAST NOTIFICATION ---
    const mostrarToast = (txt) => {
        const x = document.getElementById("toast");
        x.textContent = txt; 
        x.classList.add("show");
        setTimeout(() => { x.classList.remove("show"); }, 3000);
    };

    // --- COPY FUNCTION: COPIA A TABELA COMO IMAGEM ---
    const copiarTabelaDetalhamento = async () => {
        const areaTabela = document.getElementById('areaTabelaDetalhamento');
        
        // Valida se há conteúdo real na tabela verificando se existe a tag <table>
        if (!areaTabela.querySelector('table')) {
            alert("Não há dados preenchidos para copiar.");
            return;
        }

        mostrarToast("Gerando imagem..."); // Feedback rápido para o usuário

        try {
            // Gera o Canvas a partir da Div
            const canvas = await html2canvas(areaTabela, {
                backgroundColor: "#ffffff", // Garante o fundo branco
                scale: 2 // Aumenta a resolução (bom para telas Retina/4k)
            });
            
            // Converte o canvas para Blob (arquivo de imagem)
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    mostrarToast("Erro ao gerar arquivo de imagem.");
                    return;
                }
                
                try {
                    // Escreve a imagem diretamente na área de transferência do sistema
                    const item = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item]);
                    mostrarToast("Imagem copiada com sucesso! 📸");
                } catch (err) {
                    console.error("Erro de permissão no Clipboard:", err);
                    alert("O seu navegador bloqueou a cópia direta da imagem. Tente usar um atalho de print da tela.");
                }
            }, "image/png");

        } catch(err) {
            console.error("Erro no html2canvas:", err);
            mostrarToast("Erro ao processar a imagem.");
        }
        
        window.getSelection().removeAllRanges();
    };

    // --- GERA O HTML DA TABELA DE DETALHAMENTO (SUBSTITUTO DO TEXTAREA) ---
    const atualizarTabelaDetalhamento = () => {
        const areaTabela = document.getElementById('areaTabelaDetalhamento');
        
        // Pega as datas com horas > 0 e ordena cronologicamente
        const datasOrdenadas = Object.keys(horasState)
            .filter(k => horasState[k] > 0)
            .sort((a, b) => stringParaData(a) - stringParaData(b));

        if (datasOrdenadas.length === 0) {
            areaTabela.innerHTML = '<div class="mensagem-vazia">Nenhuma hora distribuída ainda.</div>';
            return;
        }

        // Determinar Início e Fim do Grid Visual Baseado no Input
        const dtInicio = stringParaData(datasOrdenadas[0]);
        const dtFim = stringParaData(datasOrdenadas[datasOrdenadas.length - 1]);

        let calStart = new Date(dtInicio);
        calStart.setDate(calStart.getDate() - calStart.getDay()); // Recua para Domingo

        let calEnd = new Date(dtFim);
        if (calEnd.getDay() !== 6) {
            calEnd.setDate(calEnd.getDate() + (6 - calEnd.getDay())); // Avança para Sábado
        }

        let totalHoras = 0;
        
        // Estrutura inicial da tabela
        let htmlTabela = `
            <table class="tabela-detalhamento" style="font-family: Verdana, sans-serif; font-size: 12px; width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr style="background-color: #eee;">
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">D</th>
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">S</th>
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">T</th>
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">Q</th>
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">Q</th>
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">S</th>
                        <th style="padding: 5px; border: 1px solid #ccc; width: 14%;">S</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let currDate = new Date(calStart);
        while (currDate <= calEnd) {
            if (currDate.getDay() === 0) htmlTabela += '<tr>';

            let dataStr = String(currDate.getDate()).padStart(2, '0') + '/' + 
                          String(currDate.getMonth() + 1).padStart(2, '0') + '/' + 
                          currDate.getFullYear();

            let horas = horasState[dataStr] || 0;
            let temHoras = horas > 0;
            if (temHoras) totalHoras += horas;

            // Define estilos em linha para funcionar quando colar no E-mail (Outlook/Gmail perdem as classes)
            let bgColor = temHoras ? "#ffffff" : "#eeeeee";
            let colorTxt = temHoras ? "#002233" : "#ccc";
            let txtHoras = temHoras ? `<strong>${horas.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 2})}h</strong>` : '--';

            htmlTabela += `
                <td class="${temHoras ? 'dia-preenchido' : 'dia-desabilitado'}" style="padding: 5px; border: 1px solid #ccc; background-color: ${bgColor}; color: ${colorTxt}; line-height: 1.4;">
                    <span class="dia-numero" style="font-weight: normal;">${currDate.getDate()}</span><br>
                    <span class="dia-horas">${txtHoras}</span>
                </td>
            `;

            if (currDate.getDay() === 6) htmlTabela += '</tr>';
            currDate.setDate(currDate.getDate() + 1);
        }

        htmlTabela += `
                </tbody>
            </table>
            <div style="text-align: right; margin-top: 10px; font-family: Verdana, sans-serif; font-size: 13px;">
                Total Diário: <strong>${totalHoras.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 2})} horas</strong>
            </div>
        `;

        areaTabela.innerHTML = htmlTabela;
    };


    const registrarCliqueHora = (indexAtual) => {
        if (usouTabNesteModal) return;
        if (indexAtual === ultimoInputClicado + 1) {
            contadorCliquesHora++;
        } else {
            contadorCliquesHora = 1; 
        }
        ultimoInputClicado = indexAtual;
        if (contadorCliquesHora >= 5) {
            document.getElementById('dicaTabModal').style.display = 'block';
        }
    };

    const verificarTab = (event) => {
        if (event.key === 'Tab') {
            document.getElementById('dicaTabModal').style.display = 'none';
            usouTabNesteModal = true; 
        }
    };

    const mascaraData = (input) => {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 8) v = v.substring(0, 8);
        if (v.length > 2) v = v.substring(0, 2) + "/" + v.substring(2);
        if (v.length > 5) v = v.substring(0, 5) + "/" + v.substring(5);
        input.value = v;
        
        if(v.length === 10 || v.length === 0) {
            if (input.id === 'txtInicio') {
                let dt = stringParaData(v);
                let pickerFim = document.getElementById('pickerFim');
                if (dt) {
                    let ano = dt.getFullYear();
                    let mes = String(dt.getMonth() + 1).padStart(2, '0');
                    let dia = String(dt.getDate()).padStart(2, '0');
                    pickerFim.min = `${ano}-${mes}-${dia}`;
                } else {
                    pickerFim.removeAttribute('min');
                }
            }
            gerarDistribuicao();
        }
    };

    const atualizarDataPicker = (picker, textInputId) => {
        if (!picker.value) return;
        const [ano, mes, dia] = picker.value.split('-');
        document.getElementById(textInputId).value = `${dia}/${mes}/${ano}`;
        
        if (textInputId === 'txtInicio') {
            document.getElementById('pickerFim').min = picker.value;
        }
        gerarDistribuicao();
    };

    const stringParaData = (dataStr) => {
        if (!dataStr || dataStr.length !== 10) return null;
        const partes = dataStr.split('/');
        const dia = parseInt(partes[0], 10);
        const mes = parseInt(partes[1], 10) - 1; 
        const ano = parseInt(partes[2], 10);
        const data = new Date(ano, mes, dia);
        return (data.getFullYear() === ano && data.getMonth() === mes && data.getDate() === dia) ? data : null;
    };

    const parseHoras = (valor) => {
        if (!valor) return 0;
        let limpo = valor.toString().replace(',', '.').replace(/[^0-9.]/g, '');
        return isNaN(parseFloat(limpo)) ? 0 : parseFloat(limpo);
    };

    const FERIADOS_EXTRAS = ["20/11", "09/07"]; 
    let feriadosCacheados = {};

    const obterFeriadosNacionais = (ano) => {
        if (feriadosCacheados[ano]) return feriadosCacheados[ano];
        let feriados = [`01/01/${ano}`, `21/04/${ano}`, `01/05/${ano}`, `07/09/${ano}`, `12/10/${ano}`, `02/11/${ano}`, `15/11/${ano}`, `20/11/${ano}`, `25/12/${ano}`];
        FERIADOS_EXTRAS.forEach(f => feriados.push(`${f}/${ano}`));
        let a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4;
        let f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
        let i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
        let m = Math.floor((a + 11 * h + 22 * l) / 451), mes = Math.floor((h + l - 7 * m + 114) / 31);
        let dia = ((h + l - 7 * m + 114) % 31) + 1;
        let pascoa = new Date(ano, mes - 1, dia);
        let formata = (dt) => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + ano;
        let carnaval = new Date(pascoa); carnaval.setDate(pascoa.getDate() - 47);
        let sextaSanta = new Date(pascoa); sextaSanta.setDate(pascoa.getDate() - 2);
        let corpusChristi = new Date(pascoa); corpusChristi.setDate(pascoa.getDate() + 60);
        feriados.push(formata(carnaval), formata(sextaSanta), formata(corpusChristi));
        feriadosCacheados[ano] = feriados;
        return feriados;
    };

    const gerarDistribuicao = () => {
        let horasPrevistas = parseHoras(document.getElementById('txtHoras').value);
        let dtInStr = document.getElementById('txtInicio').value;
        let dtFimStr = document.getElementById('txtFim').value;
        
        dataInicioGlobal = dtInStr.length === 10 ? stringParaData(dtInStr) : null;
        dataFimGlobal = dtFimStr.length === 10 ? stringParaData(dtFimStr) : null;

        if (dataInicioGlobal && dataFimGlobal && dataFimGlobal < dataInicioGlobal) {
            document.getElementById('txtFim').value = "";
            document.getElementById('pickerFim').value = "";
            dataFimGlobal = null;
        }

        horasState = {}; 

        if (dataInicioGlobal && dataFimGlobal && dataFimGlobal >= dataInicioGlobal) {
            currentDate = new Date(dataInicioGlobal.getFullYear(), dataInicioGlobal.getMonth(), 1);
            if (horasPrevistas > 0) {
                let diasUteis = [];
                let dtTemp = new Date(dataInicioGlobal);
                while (dtTemp <= dataFimGlobal) {
                    let ano = dtTemp.getFullYear();
                    let feriados = obterFeriadosNacionais(ano);
                    let dataStr = String(dtTemp.getDate()).padStart(2, '0') + '/' + String(dtTemp.getMonth() + 1).padStart(2, '0') + '/' + ano;
                    let isFds = dtTemp.getDay() === 0 || dtTemp.getDay() === 6;
                    let isFeriado = feriados.includes(dataStr);
                    if (!isFds && !isFeriado) diasUteis.push(dataStr);
                    dtTemp.setDate(dtTemp.getDate() + 1);
                }
                if (diasUteis.length > 0) {
                    let mediaHoras = horasPrevistas / diasUteis.length;
                    let horasPreencher = (mediaHoras > 6) ? 8 : 4; 
                    diasUteis.forEach(dia => horasState[dia] = horasPreencher);
                }
            }
        }
        renderCalendario();
    };

    const mudarMes = (delta) => {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendario();
    };

    const renderCalendario = () => {
        const wrapper = document.getElementById('calendariosWrapper');
        wrapper.innerHTML = '';
        const meses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
        let m1 = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        let m2 = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
        let isWide = window.innerWidth >= 768;

        if (isWide) {
            document.getElementById('calMesAno').textContent = `${meses[m1.getMonth()]} - ${meses[m2.getMonth()]} / ${m1.getFullYear()}`;
        } else {
            document.getElementById('calMesAno').textContent = `${meses[m1.getMonth()]} ${m1.getFullYear()}`;
        }

        let inputIndex = 0;
        [m1, m2].forEach((baseDate, idx) => {
            let ano = baseDate.getFullYear();
            let mes = baseDate.getMonth();
            let mesWrapper = document.createElement('div');
            mesWrapper.className = `mes-wrapper ${idx === 1 ? 'mes-proximo' : ''}`;
            if (isWide) {
                mesWrapper.innerHTML = `<div class="mes-titulo">${meses[mes]} ${ano}</div>`;
            }
            let grid = document.createElement('div');
            grid.className = 'calendario-grid';
            grid.innerHTML = '<div class="cal-dias-semana"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>';
            let primeiroDiaMes = new Date(ano, mes, 1).getDay();
            let totalDiasMes = new Date(ano, mes + 1, 0).getDate();
            let feriados = obterFeriadosNacionais(ano);
            for (let i = 0; i < primeiroDiaMes; i++) {
                grid.innerHTML += `<div class="cal-dia fora-mes"></div>`;
            }
            for (let dia = 1; dia <= totalDiasMes; dia++) {
                let dtAtual = new Date(ano, mes, dia);
                let dataStr = String(dia).padStart(2, '0') + '/' + String(mes + 1).padStart(2, '0') + '/' + ano;
                let isFeriado = feriados.includes(dataStr);
                let isFds = dtAtual.getDay() === 0 || dtAtual.getDay() === 6;
                let ehDescanso = isFds || isFeriado;
                let foraPeriodo = false;
                if (dataInicioGlobal && dataFimGlobal) {
                    foraPeriodo = dtAtual < dataInicioGlobal || dtAtual > dataFimGlobal;
                }
                let valNumerico = horasState[dataStr];
                let temHoras = valNumerico !== undefined && valNumerico > 0;
                let classeExtra = [];
                if (foraPeriodo) classeExtra.push('fora-periodo');
                if (ehDescanso) classeExtra.push('descanso');
                if (ehDescanso && temHoras) classeExtra.push('preenchido');
                let valDisplay = temHoras ? String(valNumerico).replace('.', ',') : '';
                let inputHTML = foraPeriodo ? 
                    '<input disabled>' : 
                    `<input type="text" data-dia="${dataStr}" value="${valDisplay}" 
                        placeholder="${ehDescanso ? '-' : ''}"
                        oninput="atualizarHora(this)"
                        onmousedown="registrarCliqueHora(${inputIndex++})" 
                        onkeydown="verificarTab(event)">`;
                grid.innerHTML += `
                    <div class="cal-dia ${classeExtra.join(' ')}">
                        <span>${dia}</span>
                        ${inputHTML}
                    </div>
                `;
            }
            mesWrapper.appendChild(grid);
            wrapper.appendChild(mesWrapper);
        });
        atualizarTotais();
    };

    const atualizarHora = (input) => {
        let val = input.value.trim();
        let dataStr = input.dataset.dia;
        
        let horasFormatadas = parseHoras(val);

        // Limita a quantidade de horas diárias em 8h e emite o aviso
        if (horasFormatadas > 8) {
            horasFormatadas = 8;
            input.value = "8";
            mostrarToast("⚠️ O limite máximo é de 8 horas por dia.");
        }

        if (val === "" || horasFormatadas === 0) {
            delete horasState[dataStr];
        } else {
            horasState[dataStr] = horasFormatadas;
        }

        const pai = input.parentElement;
        if (pai.classList.contains('descanso')) {
            if (horasState[dataStr] > 0) pai.classList.add('preenchido');
            else pai.classList.remove('preenchido');
        }
        atualizarTotais();
    };

    const atualizarTotais = () => {
        let totalNoCalendario = 0;
        let temFeriadoPreenchido = false;
        for (let key in horasState) {
            if (horasState[key] > 0) {
                let dt = stringParaData(key);
                if (!dataInicioGlobal || !dataFimGlobal || (dt >= dataInicioGlobal && dt <= dataFimGlobal)) {
                    totalNoCalendario += horasState[key];
                }
                if (dt) {
                    let feriados = obterFeriadosNacionais(dt.getFullYear());
                    let isFds = dt.getDay() === 0 || dt.getDay() === 6;
                    if (isFds || feriados.includes(key)) temFeriadoPreenchido = true;
                }
            }
        }
        
        const avisoFeriado = document.getElementById('avisoFeriadoModal');
        const dicaTab = document.getElementById('dicaTabModal');
        
        if (temFeriadoPreenchido) {
            avisoFeriado.style.display = 'block';
            dicaTab.style.display = 'none'; 
        } else {
            avisoFeriado.style.display = 'none';
            // Garante que a dica só apareça se atingir 5 cliques consecutivos e não tiver usado o Tab
            if (contadorCliquesHora >= 5 && !usouTabNesteModal) {
                dicaTab.style.display = 'block';
            } else {
                dicaTab.style.display = 'none';
            }
        }

        let horasPrevistas = parseHoras(document.getElementById('txtHoras').value);
        let elTotal = document.getElementById('previewTotalHoras');
        const strTotal = totalNoCalendario.toLocaleString('pt-BR', {maximumFractionDigits: 2});
        const strDeclarado = horasPrevistas.toLocaleString('pt-BR', {maximumFractionDigits: 2});
        
        elTotal.innerHTML = `Total <strong>${strTotal}</strong> de <strong>${strDeclarado} horas</strong>`;
        if (totalNoCalendario === horasPrevistas && horasPrevistas > 0) {
            elTotal.style.color = "var(--az-escuro)";
        } else {
            elTotal.style.color = "var(--cinza)";
        }

        atualizarTabelaDetalhamento();
    };

    const limparCalendario = () => {
        if(confirm("Tem certeza que deseja limpar tudo?")) {
            document.getElementById('txtHoras').value = "";
            document.getElementById('txtInicio').value = "";
            document.getElementById('txtFim').value = "";
            document.getElementById('pickerInicio').value = "";
            document.getElementById('pickerFim').value = "";
            document.getElementById('pickerFim').removeAttribute('min'); 
            dataInicioGlobal = null;
            dataFimGlobal = null;
            horasState = {};
            contadorCliquesHora = 0;
            ultimoInputClicado = -1;
            usouTabNesteModal = false;
            document.getElementById('dicaTabModal').style.display = 'none';
            renderCalendario();
        }
    };

    // --- ATALHO: SETAS PARA CIMA/BAIXO PARA ALTERAR HORAS ---
    let inputSendoHovered = null;

    // Detecta quando o mouse entra em um input ou na célula do calendário
    document.addEventListener('mouseover', (e) => {
        if (e.target.matches('#txtHoras')) {
            inputSendoHovered = e.target;
        } else {
            // Expande a área de detecção para a célula inteira do dia (melhor UX)
            let calDia = e.target.closest('.cal-dia');
            if (calDia) {
                let inputDia = calDia.querySelector('input:not([disabled])');
                if (inputDia) inputSendoHovered = inputDia;
            }
        }
    });

    document.addEventListener('mouseout', (e) => {
        // Se sair da célula ou do input principal, remove o foco do hover
        if (e.target === inputSendoHovered || (e.target.closest && e.target.closest('.cal-dia'))) {
            inputSendoHovered = null;
        }
    });

    document.addEventListener('keydown', (e) => {
        // Prioriza o input que está clicado/selecionado no momento. 
        // Se não houver clique, usa o input que o mouse está em cima.
        let activeEl = document.activeElement;
        let temFoco = activeEl && (activeEl.id === 'txtHoras' || activeEl.closest('.cal-dia'));
        let inputAlvo = temFoco ? activeEl : inputSendoHovered;

        if (!inputAlvo) return;

        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault(); 
            
            let valorAtual = parseHoras(inputAlvo.value);
            let novoValor = e.key === 'ArrowUp' ? valorAtual + 1 : valorAtual - 1;
            
            if (novoValor < 0) novoValor = 0; 
            
            // Trava em 8 horas e exibe o aviso exclusivamente se for um dia do calendário
            if (inputAlvo.id !== 'txtHoras' && novoValor > 8) {
                novoValor = 8;
                mostrarToast("⚠️ O limite máximo é de 8 horas por dia.");
            }
            
            inputAlvo.value = novoValor > 0 ? novoValor.toString().replace('.', ',') : '';
            inputAlvo.dispatchEvent(new Event('input', { bubbles: true }));
        }
    });

    window.onload = () => {
        currentDate.setDate(1);
        renderCalendario();
    };

    window.addEventListener('resize', renderCalendario);

</script>
</body>
</html>
