<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Gerador de Email - Item Contábil</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .excluir {
            margin: 0;
            margin-top: -64px;
            background: transparent;
            color: var(--vermelho);
            position: relative;
            z-index: 10;
            float: right;
            border: none;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
            width: 25px;
        }

        novoitem, projetosformatados {
            font-weight: 800;
        }
    </style>
</head>

<body>

    <h1><strong class="azul-claro">Alteração de</strong> Item Contábil</h1>
    <div class="container container-azul">

        <section class="container-formulario">
            <div class="topo">
                <h2>Projetos para alteração</h2>                
            </div>

            <br>
            
            <div class="input-group">
                <div class="input-item" style="width: 100%;">
                    <label for="formatoSaida">Formato:</label>
                    <select id="formatoSaida" onchange="gerarEmail()">
                        <option value="Ticket" selected>Ticket (Sem saudação/despedida)</option>
                        <option value="Email">E-mail (Com saudação/despedida)</option>
                    </select>
                </div>
            </div>

            <div id="projetosContainer">
                <div class="projeto-row">
                    <div class="input-group">
                        <div class="input-item">
                            <label>Cód. projeto:</label>
                            <input type="text" class="codProjeto" placeholder="Ex: D000..." oninput="gerarEmail()">
                        </div>
                        <div class="input-item">
                            <label>Nome do projeto:</label>
                            <input type="text" class="nomeProjeto" placeholder=" " oninput="gerarEmail()">
                        </div>
                    </div>
                </div>
            </div>

            <br>

            <div class="input-group">
                <div class="input-item">
                    <label for="novoItem">Novo item contábil:</label>
                    <select id="novoItem" onchange="gerarEmail()">
                        <option value="16 - HOSPITALITY - 1600">16 - HOSPITALITY - 1600</option>
                    </select>
                </div>
            </div>
            
        </section>

        <section class="container-resultado">
            <h3 class="roxo"><span class="azul">Mensagem</span> gerada</h3>

            <div class="resultado">
                <button class="btn-roxo btn-aux" onclick="copiarTextoSimples('resultadoAssunto')">Copiar</button>
                <label>Assunto</label>
                <pre id="resultadoAssunto"></pre>
            </div>

            <div class="resultado">
                <button class="btn-roxo btn-aux" onclick="copiarTextoRico('resultadoCorpo')">Copiar</button>
                <label>Mensagem</label>
                <pre id="resultadoCorpo"></pre>
            </div>
        </section>

        <section class="botoes-de-acao">
            <button class="btn-azul btn-add"  onclick="adicionarProjeto()">Adicionar Projeto</button>
            <button class="btn-laranja" onclick="limparFormulario()">Limpar</button>
            <div id="toast">Copiado para a área de transferência!</div>
        </section>
    </div>  

    <script>
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        function obterSaudacao() {
            const hora = parseInt(new Date().toLocaleString("en-US", {
                timeZone: "America/Sao_Paulo",
                hour: "numeric",
                hour12: false
            }));

            if (hora >= 5 && hora < 12) return "bom dia";
            else if (hora >= 12 && hora < 18) return "boa tarde";
            else return "boa noite";
        }

        function adicionarProjeto() {
            const container = document.getElementById('projetosContainer');
            const novaLinha = document.createElement('div');
            novaLinha.className = 'projeto-row';
            novaLinha.style.marginTop = '20px'; 
            
            novaLinha.innerHTML = `
                <div>
                    <div class="input-group">
                        <div class="input-item">
                            <label>Cód. projeto:</label>
                            <input type="text" class="codProjeto" placeholder="Ex: D000..." oninput="gerarEmail()">
                        </div>
                        <div class="input-item">
                            <label>Nome do projeto:</label>
                            <input type="text" class="nomeProjeto" placeholder=" " oninput="gerarEmail()">
                        </div>
                    </div>
                    <button class="excluir" title="Remover este projeto" onclick="removerProjeto(this)">X</button>
                </div>
            `;
            container.appendChild(novaLinha);
            gerarEmail(); 
        }

        function removerProjeto(botao) {
            botao.closest('.projeto-row').remove();
            gerarEmail(); 
        }

        function gerarEmail() {
            const formatoSaida = document.getElementById('formatoSaida').value;
            const novoItem = document.getElementById('novoItem').value;
            const codigos = document.querySelectorAll('.codProjeto');
            const nomes = document.querySelectorAll('.nomeProjeto');
            
            let projetosFormatados = "";
            let primeiroCodigo = "";
            let primeiroNome = "";
            let qtdProjetosPreenchidos = 0;

            for (let i = 0; i < codigos.length; i++) {
                const cod = codigos[i].value.trim();
                const nome = nomes[i].value.trim();
                
                if ((cod || nome) && qtdProjetosPreenchidos === 0) {
                    primeiroCodigo = cod;
                    primeiroNome = nome;
                }
                
                if (cod || nome) {
                    qtdProjetosPreenchidos++;
                    const exibirCod = cod ? cod : "[Cód. Projeto]";
                    const exibirNome = nome ? nome : "[Nome do Projeto]";
                    
                    // Coloca apenas o código em negrito
                    projetosFormatados += `<strong>${exibirCod}</strong> - ${exibirNome}\n`;
                }
            }

            // Lógica do Assunto: Removido o "Diversos Projetos"
            let assunto = 'Alteração de item contábil';
            if (qtdProjetosPreenchidos === 1 && (primeiroCodigo || primeiroNome)) {
                let infoProjeto = [primeiroCodigo, primeiroNome].filter(Boolean).join(' - ');
                assunto = `Alteração de item contábil - ${infoProjeto}`;
            }

            const pluralTexto = qtdProjetosPreenchidos > 1 ? "dos projetos abaixo" : "do projeto abaixo";

            // Se nada for digitado, mostra uma estrutura base
            if (qtdProjetosPreenchidos === 0) {
                 projetosFormatados = "<strong>[Cód. Projeto]</strong> - [Nome do Projeto]\n";
            }

            let corpoEmail = `Solicito a alteração do item contábil ${pluralTexto} para <strong>${novoItem}</strong>:\n\n${projetosFormatados}`;

            // Adiciona saudação e despedida apenas se for E-mail
            if (formatoSaida === 'Email') {
                const saudacao = obterSaudacao();
                corpoEmail = `Olá, ${saudacao}!\n\n` + corpoEmail + `\nAtenciosamente,`;
            }

            document.getElementById('resultadoAssunto').textContent = assunto;
            
            // Converte as quebras de linha em tags <br> para funcionar com innerHTML
            document.getElementById('resultadoCorpo').innerHTML = corpoEmail.replace(/\n/g, '<br>'); 
        }

        function mostrarToast(texto) {
            var x = document.getElementById("toast");
            let textoExibido = texto.length > 40 ? texto.substring(0, 40) + "..." : texto;
            x.textContent = `"${textoExibido}" copiado!`;
            x.className = "show";
            setTimeout(function () { x.className = x.className.replace("show", ""); }, 4000);
        }

        // Função para copiar o assunto sem formatar
        function copiarTextoSimples(idElemento) {
            const texto = document.getElementById(idElemento).textContent;
            if (!texto.trim()) return;
            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast(texto);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }

        // Função principal para copiar mantendo quebras de linha e negrito corretos em qualquer sistema
        async function copiarTextoRico(idElemento) {
            const elemento = document.getElementById(idElemento);
            const html = elemento.innerHTML;
            const textoPuro = elemento.innerText; // innerText preserva as quebras naturalmente

            const htmlFormatado = `<div style="margin: 0 !important; padding: 0 !important; text-indent: 0 !important; font-family: Arial, sans-serif;">${html}</div>`;

            try {
                const blobHTML = new Blob([htmlFormatado], { type: "text/html" });
                const blobText = new Blob([textoPuro], { type: "text/plain" });
                const data = [new ClipboardItem({ 
                    "text/html": blobHTML, 
                    "text/plain": blobText 
                })];
                
                await navigator.clipboard.write(data);
                mostrarToast("Mensagem copiada!");
            } catch (err) {
                console.error("Erro ao copiar formatado, tentando cópia simples...", err);
                copiarTextoSimples(idElemento); 
            }
        }

        function limparFormulario() {
            document.getElementById('formatoSaida').selectedIndex = 0; // Restaura Ticket
            document.getElementById('novoItem').selectedIndex = 0;
            const container = document.getElementById('projetosContainer');
            container.innerHTML = `
                <div class="projeto-row">
                    <div class="input-group">
                        <div class="input-item">
                            <label>Cód. projeto:</label>
                            <input type="text" class="codProjeto" placeholder="Ex: D000..." oninput="gerarEmail()">
                        </div>
                        <div class="input-item">
                            <label>Nome do projeto:</label>
                            <input type="text" class="nomeProjeto" placeholder=" " oninput="gerarEmail()">
                        </div>
                    </div>
                </div>
            `;
            gerarEmail();
        }

        window.onload = function () {
            gerarEmail();
        };
    </script>
</body>
</html>
