<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Encerramento de Projeto</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="image/x-icon" href="favicons/encerramento.ico">
    <style>
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <h1>Solicitação de <span class="azul-claro">Encerramento</span></h1>
    </header>

    <main class="container container-azul">

        <section class="container-formulario" id="formEncerramento">
            
            <div class="topo">
                <h2>Dados do Projeto</h2>                
            </div>
            <br>
        
            <div class="input-group">
                <div class="input-item">
                    <label for="codProjeto">Cód. projeto:</label>
                    <input type="text" id="codProjeto" placeholder="Ex: D...001">
                </div>
                <div class="input-item">
                    <label for="codCliente">Cód. cliente:</label>
                    <input type="text" id="codCliente" placeholder="Ex: T...">
                </div>
            </div>

            <div class="input-group">
                <div class="input-item">
                    <label for="nomeProjeto">Nome do projeto:</label>
                    <input type="text" id="nomeProjeto" placeholder="">
                </div>
            </div>
        
            <label for="tipoJustificativa">Justificativa:</label>
            <select id="tipoJustificativa">           
                <option value="Conclusão do Projeto">Conclusão do Projeto</option>
                <option value="Cancelamento do Projeto">Cancelamento do Projeto</option>
            </select>
        
            <div id="ticketDiv" class="input-item hidden" style="margin-top: 10px;">
                <label for="numTicket">Nº do Ticket <span class="vermelho">*</span>:</label>
                <input type="text" id="numTicket" placeholder="Ex: 123456">
            </div>
        </section>

        <section class="container-resultado">
            <div class="resultado">
                <button class="btn-azul btn-aux" id="btnCopiarAssunto">Copiar</button>
                <label>Assunto</label>
                <pre id="resultadoAssunto"></pre>
            </div>

            <div class="resultado">
                <button class="btn-azul btn-aux" id="btnCopiarMensagem">Copiar</button>
                <label>Mensagem</label>
                <pre id="resultadoCorpo"></pre>
            </div>
        </section>

        <section class="botoes-de-acao">
            <button class="btn-roxo" id="btnTicket">Ticket</button>
            <button class="btn-roxo" id="btnCopiarStatus">Status</button>
            <button class="btn-verde" id="btnIndicadores">Indicadores</button>
            <button class="btn-laranja" id="btnLimpar">Limpar</button>
            <div id="toast">Copiado para a área de transferência!</div>
        </section>
    </main>  

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        const formElements = {
            codProjeto: document.getElementById('codProjeto'),
            nomeProjeto: document.getElementById('nomeProjeto'),
            codCliente: document.getElementById('codCliente'),
            tipoJustificativa: document.getElementById('tipoJustificativa'),
            numTicket: document.getElementById('numTicket'),
            ticketDiv: document.getElementById('ticketDiv')
        };

        const resultElements = {
            assunto: document.getElementById('resultadoAssunto'),
            corpo: document.getElementById('resultadoCorpo')
        };

        const mudarJustificativa = () => {
            const tipo = formElements.tipoJustificativa.value;

            if (tipo === 'Cancelamento do Projeto') {
                formElements.ticketDiv.classList.remove('hidden');
                formElements.numTicket.focus();
            } else {
                formElements.ticketDiv.classList.add('hidden');
                formElements.numTicket.value = '';
            }
            gerarEmail();
        };

        const gerarEmail = () => {
            const codProjeto = formElements.codProjeto.value.trim();
            const nomeProjeto = formElements.nomeProjeto.value.trim();
            const codCliente = formElements.codCliente.value.trim();
            const tipoJustificativa = formElements.tipoJustificativa.value;
            const numTicket = formElements.numTicket.value.trim();

            // Lógica do Contrato: Código do projeto menos os 3 últimos números
            let codContrato = '';
            if (codProjeto.length > 3) {
                codContrato = codProjeto.slice(0, -3);
            }

            // Define Assunto
            const assunto = codProjeto ? `${codProjeto} - Solicitação de Encerramento` : 'Solicitação de Encerramento';

            // Define Justificativa
            let txtJustificativa = '';
            if (tipoJustificativa === 'Conclusão do Projeto') {
                txtJustificativa = 'Certificado de Conclusão disponível no repositório do projeto.';
            } else if (tipoJustificativa === 'Cancelamento do Projeto') {
                txtJustificativa = `Encerramento do projeto devido ao cancelamento registrado no ticket nº ${numTicket || 'XXXXX'}`;
            }

            // Define Corpo do Email
            const corpoEmail = `Gentileza proceder com o encerramento do projeto abaixo:

Nº Contrato: ${codContrato}
Código do cliente: ${codCliente}

Código do projeto: ${codProjeto}
Nome do projeto: ${nomeProjeto}

Justificativa: ${txtJustificativa}`;

            // Renderiza
            resultElements.assunto.textContent = assunto;
            resultElements.corpo.innerHTML = corpoEmail.replace(/\n/g, '<br>');
        };

        const mostrarToast = (texto, mensagemExata = false) => {
            const toast = document.getElementById("toast");
            
            if (mensagemExata) {
                toast.textContent = texto;
            } else {
                let textoExibido = texto.length > 40 ? texto.substring(0, 40) + "..." : texto;
                toast.textContent = `"${textoExibido}" copiado!`;
            }
            
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
        };

        const copiarTextoPuro = (idElemento) => {
            const texto = document.getElementById(idElemento).textContent;
            if (!texto.trim()) return;
            
            navigator.clipboard.writeText(texto).then(() => mostrarToast(texto))
                .catch(err => console.error('Erro ao copiar: ', err));
        };

        const copiarTextoRico = async (idElemento) => {
            const elemento = document.getElementById(idElemento);
            const html = elemento.innerHTML;
            const textoPuro = elemento.innerText;
            const htmlFormatado = `<div style="margin: 0 !important; padding: 0 !important; font-family: Arial, sans-serif;">${html}</div>`;

            try {
                const data = [new ClipboardItem({ 
                    "text/html": new Blob([htmlFormatado], { type: "text/html" }), 
                    "text/plain": new Blob([textoPuro], { type: "text/plain" }) 
                })];
                await navigator.clipboard.write(data);
                mostrarToast("Texto copiado!");
            } catch (err) {
                console.warn("ClipboardItem não suportado ou falhou. Usando fallback de texto puro...", err);
                copiarTextoPuro(idElemento); 
            }
        };

        const limparFormulario = () => {
            document.querySelectorAll('#formEncerramento input[type="text"]').forEach(input => input.value = '');
            formElements.tipoJustificativa.selectedIndex = 0;
            mudarJustificativa();
        };

        const abrirIndicadores = () => {
            const codProjeto = formElements.codProjeto.value;
            const linkPlanilha = "https://docs.google.com/spreadsheets/d/19b-F8VDW_tJeJ2h4lM_owYeUDWt0upNsK_OR_bVe0aw/edit";

            navigator.clipboard.writeText(codProjeto).then(() => {
                if (codProjeto) {
                    mostrarToast("Código copiado! Abrindo planilha...", true);
                } else {
                    mostrarToast("Abrindo planilha (Nenhum código para copiar)", true);
                }
                
                setTimeout(() => window.open(linkPlanilha, '_blank'), 300);
            }).catch(() => {
                window.open(linkPlanilha, '_blank');
            });
        };

        // Event Listeners Gerais
        ['codProjeto', 'nomeProjeto', 'codCliente', 'numTicket'].forEach(id => {
            document.getElementById(id).addEventListener('input', gerarEmail);
        });

        formElements.tipoJustificativa.addEventListener('change', mudarJustificativa);
        document.getElementById('btnCopiarAssunto').addEventListener('click', () => copiarTextoPuro('resultadoAssunto'));
        document.getElementById('btnCopiarMensagem').addEventListener('click', () => copiarTextoRico('resultadoCorpo'));
        document.getElementById('btnLimpar').addEventListener('click', limparFormulario);

        // Event Listeners Novos (Ticket, Status, Indicadores)
        document.getElementById('btnCopiarStatus').addEventListener('click', () => {
            const dataFormatada = new Intl.DateTimeFormat('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            }).format(new Date());
            
            const txt = `${dataFormatada} - Encerramento Solicitado`;
            
            navigator.clipboard.writeText(txt).then(() => {
                mostrarToast(`"${txt}" copiado!`, true);
            });
        });

        document.getElementById('btnTicket').addEventListener('click', () => {
            const linkTicket = "https://suporte.interno.totvs.io/hc/pt-br/requests/new?ticket_form_id=43090375254931&tf_43653456041107=peso_2&tf_43093105543571=CST_PMO+Local_Gest%C3%A3o+de+Projetos_Encerramento+-+Projeto&isLeaf=level4&tf_43093056156819=01KQMPRQ5859J7KT10J1V04R8N&tf_undefined=portal_cst_brasil&pais=Brasil&tf_49875679614355=pais_brasil&level1=PMO+Local&level2=Gest%C3%A3o+de+Projetos&level3=Encerramento+-+Projeto";
            
            navigator.clipboard.writeText(linkTicket).then(() => {
                mostrarToast("Caminho do ticket copiado! Cole no navegador.", true);
            });
        });

        document.getElementById('btnIndicadores').addEventListener('click', abrirIndicadores);

        // Inicializa
        mudarJustificativa();
    });
    </script>
</body>
</html>
