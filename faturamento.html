<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Faturamento</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://danignvs.github.io/totvs/favicons/fat.ico">
</head>

<body>

    <header>
        <h1><span class="azul-claro">Solicitação</span> de Faturamento</h1>
    </header>

    <main class="container container-azul">

        <section class="container-formulario" id="formFaturamento">

            <div class="topo">
                <h2></h2>
                <button class="btn-vermelho btn-aux" id="btnLimpar" 
                    style="padding: 15px 0 0 0; background-color: transparent; color: var(--vermelho)">
                    <img src="imagens/lixeira-vermelha.svg" style="width: 20px;">
                </button>
            </div>
            <br>

            <!-- Nome do projeto -->
            <div class="input-group">
                <div class="input-item">
                    <label for="nomeProjeto">Nome do projeto:</label>
                    <input type="text" id="nomeProjeto" placeholder="">
                </div>
            </div>

            <!-- Código do projeto / contrato -->
            <div class="input-group">

                <div class="input-item">
                    <label for="codProjeto">Código do projeto:</label>

                    <div class="input-com-copia">
                        <input type="text" id="codProjeto" placeholder="">
                        <button type="button" class="btn-copiar-input"
                            id="btnCopiarCodProjeto"
                            title="Copiar código do projeto"
                            aria-label="Copiar código do projeto">
                            📋
                        </button>
                    </div>
                </div>

                <div class="input-item">
                    <label for="codContratoPSA">Código do contrato:</label>

                    <div class="input-com-copia">
                        <input type="text" id="codContratoPSA" placeholder="">
                        <button type="button" class="btn-copiar-input"
                            id="btnCopiarCodContrato"
                            title="Copiar código do contrato"
                            aria-label="Copiar código do contrato">
                            📋
                        </button>
                    </div>
                </div>

            </div>

            <!-- Código cliente / valor -->
            <div class="input-group">

                <div class="input-item">
                    <label for="codCliente">Código do cliente:</label>
                    <input type="text" id="codCliente" placeholder="">
                </div>

                <div class="input-item">
                    <label for="valorLiquido">Valor líquido:</label>
                    <input type="text" id="valorLiquido" placeholder="">
                </div>

            </div>

            <!-- Justificativa + Ticket na mesma linha -->
            <div class="input-group">

                <div class="input-item">
                    <label for="tipoJustificativa">Justificativa:</label>

                    <select id="tipoJustificativa">
                        <option value="Padrao">Termo de conclusão assinado</option>
                        <option value="Unilateral">Faturamento unilateral</option>
                        <option value="Outras">Outras (digitar abaixo)</option>
                    </select>
                </div>

                <!-- campo Ticket -->
                <div class="input-item hidden">
                    <label for="ticket">Ticket:</label>
                    <input type="text" id="ticket" placeholder="Copie após o envio da solicitação">
                </div>

            </div>

            <!-- Div que aparece apenas ao selecionar "Outras" -->
            <div id="justificativaManualDiv" class="justificativa-manual" style="display: none;">
                <label for="justificativa">Digite sua Justificativa:</label>
                <input type="text" id="justificativa" placeholder="Descreva a justificativa aqui...">
            </div>

        </section>

        <section class="container-resultado">

            <div class="resultado">
                <button class="btn-azul btn-aux" id="btnCopiarAssunto">Copiar</button>
                <label>Assunto</label>
                <pre id="resultadoAssunto"></pre>
            </div>

            <div class="resultado">
                <button class="btn-azul btn-aux" id="btnCopiarMensagem">Copiar</button>
                <label>Mensagem</label>
                <pre id="resultadoCorpo"></pre>
            </div>

        </section>

        <section class="botoes-de-acao">

            <a class="btn btn-roxo"
                href="https://suporte.interno.totvs.io/hc/pt-br/requests/new?ticket_form_id=43090375254931&tf_43653456041107=peso_4&tf_43093105543571=CST_PMO+Local_Gest%C3%A3o+de+Projetos_Solicita%C3%A7%C3%A3o+de+Faturamento+-+Projeto&isLeaf=level4&tf_43093056156819=01KQMPRJP2AGE5BP7D362CCRW9&tf_undefined=portal_cst_brasil&pais=Brasil&tf_49875679614355=pais_brasil&level1=PMO+Local&level2=Gest%C3%A3o+de+Projetos&level3=Solicita%C3%A7%C3%A3o+de+Faturamento+-+Projeto"
                target="_blank">
                Ticket
            </a>

            <button class="btn-rosa" id="btnCopiarStatus">Status</button>
            <button class="btn-verde" id="btnIndicadores">Indicadores</button>

            <div id="toast">Copiado para a área de transferência!</div>

        </section>

    </main>

    <!-- Container onde o menu externo será renderizado -->
    <div id="menu-container"></div>

    <!-- Modal de Status -->
    <div id="modalStatus" class="modal-overlay">
        <div class="modal-box">
            <button class="btn-fechar-modal" id="btnFecharModalStatus">X</button>
            <h3 class="azul-claro" style="margin-bottom: 15px;"></h3>
            
            <label for="inputTicketModal">Ticket gerado na solicitação</label>
            <input type="text" id="inputTicketModal" placeholder="">
            
            <br><br>
            <button class="btn btn-roxo" id="btnConfirmarStatusModal">Copiar Status</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ============================================================
            // 0. LÓGICA DO MENU DINÂMICO
            // ============================================================
            fetch('menu.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('menu-container').innerHTML = html;
                    const currentPage = window.location.pathname.split('/').pop() || 'planejamento-calculadora.html';
                    const links = document.querySelectorAll('#menu-container a');
                    links.forEach(link => {
                        if (link.getAttribute('href') === currentPage) {
                            link.parentElement.remove();
                        }
                    });
                })
                .catch(err => console.error('Erro ao carregar o menu:', err));

            // ============================================================
            // 1. CONFIGURAÇÕES INICIAIS
            // ============================================================
            if (history.scrollRestoration) {
                history.scrollRestoration = 'manual';
            }
            window.scrollTo(0, 0);

            const JUSTIFICATIVA_PADRAO = "Termo de conclusão assinado no repositório do projeto.";
            const JUSTIFICATIVA_UNILATERAL = "Faturamento unilateral. Evidências de envio da MIT0062 disponível no repositório do fluig.";

            const formElements = {
                nomeProjeto: document.getElementById('nomeProjeto'),
                codProjeto: document.getElementById('codProjeto'),
                codContratoPSA: document.getElementById('codContratoPSA'),
                codCliente: document.getElementById('codCliente'),
                valorLiquido: document.getElementById('valorLiquido'),
                tipoJustificativa: document.getElementById('tipoJustificativa'),
                justificativa: document.getElementById('justificativa'),
                justificativaManualDiv: document.getElementById('justificativaManualDiv'),
                ticket: document.getElementById('ticket')
            };

            const resultElements = {
                assunto: document.getElementById('resultadoAssunto'),
                corpo: document.getElementById('resultadoCorpo')
            };

            // ============================================================
            // 2. FUNÇÕES DE LÓGICA
            // ============================================================
            const obterSaudacao = () => {
                const hora = parseInt(
                    new Date().toLocaleString("en-US", {
                        timeZone: "America/Sao_Paulo",
                        hour: "numeric",
                        hour12: false
                    }),
                    10
                );
                if (hora >= 5 && hora < 12) return "bom dia";
                if (hora >= 12 && hora < 18) return "boa tarde";
                return "boa noite";
            };

            const preencherContrato = () => {
                const cod = formElements.codProjeto.value;
                if (cod.length > 3) {
                    formElements.codContratoPSA.value = cod.slice(0, -3);
                } else if (cod.length === 0) {
                    formElements.codContratoPSA.value = "";
                }
            };

            const mudarJustificativa = () => {
                const { tipoJustificativa, justificativa, justificativaManualDiv } = formElements;
                const tipo = tipoJustificativa.value;

                if (tipo === 'Padrao' || tipo === 'Unilateral') {
                    justificativaManualDiv.style.display = 'none';
                } else {
                    justificativaManualDiv.style.display = 'block';
                }

                if (tipo === 'Padrao') {
                    justificativa.value = JUSTIFICATIVA_PADRAO;
                } else if (tipo === 'Unilateral') {
                    justificativa.value = JUSTIFICATIVA_UNILATERAL;
                } else if (tipo === 'Outras') {
                    if (justificativa.value === JUSTIFICATIVA_PADRAO || justificativa.value === JUSTIFICATIVA_UNILATERAL) {
                        justificativa.value = "";
                    }
                    justificativa.focus();
                } else {
                    justificativa.value = "";
                }
                gerarEmail();
            };

            const gerarEmail = () => {
                const vals = {
                    codProjeto: formElements.codProjeto.value.trim(),
                    nomeProjeto: formElements.nomeProjeto.value.trim(),
                    codContrato: formElements.codContratoPSA.value.trim(),
                    codCliente: formElements.codCliente.value.trim(),
                    justificativa: formElements.justificativa.value.trim(),
                    tipoJustificativa: formElements.tipoJustificativa.value
                };

                let valorLiq = formElements.valorLiquido.value.trim();
                if (valorLiq && !valorLiq.toUpperCase().startsWith("R$")) {
                    valorLiq = `R$ ${valorLiq}`;
                }

                // ========================================================
                // ASSUNTO
                // ========================================================
                let prefixoFaturamento = (vals.tipoJustificativa === 'Unilateral') 
                    ? 'Faturamento unilateral' 
                    : 'Faturamento';

                let assunto = vals.codProjeto || vals.nomeProjeto 
                    ? [prefixoFaturamento, vals.codProjeto, vals.nomeProjeto].filter(Boolean).join(' - ') 
                    : `Solicitação de ${prefixoFaturamento}`;

                // ========================================================
                // CORPO DO EMAIL
                // ========================================================
                let corpoEmail = `Olá, ${obterSaudacao()}!\n\n`;
                corpoEmail += `Solicito a emissão do faturamento abaixo:\n\n`;
                corpoEmail += `Código do projeto: ${vals.codProjeto}\n`;
                corpoEmail += `Nome do projeto: ${vals.nomeProjeto}\n`;
                corpoEmail += `Código do cliente: ${vals.codCliente}\n`;
                corpoEmail += `Valor líquido: ${valorLiq}\n`;
                corpoEmail += `Justificativa: ${vals.justificativa}`;

                resultElements.assunto.textContent = assunto;
                resultElements.corpo.innerHTML = corpoEmail.replace(/\n/g, '<br>');
            };

            // ============================================================
            // 3. FUNÇÕES DE UTILIDADE
            // ============================================================
            const mostrarToast = (texto, mensagemExata = false) => {
                const toast = document.getElementById("toast");
                if (mensagemExata) {
                    toast.textContent = texto;
                } else {
                    let textoExibido = texto.length > 40 ? texto.substring(0, 40) + "..." : texto;
                    toast.textContent = `"${textoExibido}" copiado!`;
                }
                toast.className = "show";
                setTimeout(() => {
                    toast.className = toast.className.replace("show", "");
                }, 4000);
            };

            const copiarTextoPuro = (idElemento) => {
                const texto = document.getElementById(idElemento).textContent;
                if (!texto.trim()) return;
                navigator.clipboard.writeText(texto)
                    .then(() => mostrarToast(texto))
                    .catch(err => console.error('Erro ao copiar: ', err));
            };

            const copiarTextoRico = async (idElemento) => {
                const elemento = document.getElementById(idElemento);
                const html = elemento.innerHTML;
                const textoPuro = elemento.innerText;
                const htmlFormatado = `<div style="margin: 0 !important; padding: 0 !important; font-family: Arial, sans-serif;">${html}</div>`;

                try {
                    const data = [
                        new ClipboardItem({
                            "text/html": new Blob([htmlFormatado], { type: "text/html" }),
                            "text/plain": new Blob([textoPuro], { type: "text/plain" })
                        })
                    ];
                    await navigator.clipboard.write(data);
                    mostrarToast("Texto copiado!");
                } catch (err) {
                    console.warn("ClipboardItem não suportado ou falhou. Usando fallback de texto puro...", err);
                    copiarTextoPuro(idElemento);
                }
            };

            const copiarValorInput = (idInput, mensagem) => {
                const input = document.getElementById(idInput);
                const valor = input.value.trim();
                if (!valor) {
                    mostrarToast("Não há valor para copiar.", true);
                    return;
                }
                navigator.clipboard.writeText(valor)
                    .then(() => {
                        mostrarToast(mensagem, true);
                    })
                    .catch(err => {
                        console.error("Erro ao copiar:", err);
                    });
            };

            const limparFormulario = () => {
                document.querySelectorAll('#formFaturamento input[type="text"]').forEach(input => {
                    input.value = '';
                });
                formElements.tipoJustificativa.selectedIndex = 0;
                mudarJustificativa();
            };

            const abrirIndicadores = () => {
                const codProjeto = formElements.codProjeto.value;
                const linkPlanilha = "https://docs.google.com/spreadsheets/d/19b-F8VDW_tJeJ2h4lM_owYeUDWt0upNsK_OR_bVe0aw/edit";

                navigator.clipboard.writeText(codProjeto)
                    .then(() => {
                        if (codProjeto) {
                            mostrarToast("Código copiado! Abrindo planilha...", true);
                        } else {
                            mostrarToast("Abrindo planilha (Nenhum código para copiar)", true);
                        }
                        setTimeout(() => window.open(linkPlanilha, '_blank'), 300);
                    })
                    .catch(() => {
                        window.open(linkPlanilha, '_blank');
                    });
            };

            // ============================================================
            // 4. EVENT LISTENERS
            // ============================================================
            ['nomeProjeto', 'codContratoPSA', 'codCliente', 'valorLiquido', 'justificativa'].forEach(id => {
                document.getElementById(id).addEventListener('input', gerarEmail);
            });

            formElements.ticket.addEventListener('input', () => {});

            formElements.codProjeto.addEventListener('input', () => {
                preencherContrato();
                gerarEmail();
            });

            formElements.tipoJustificativa.addEventListener('change', mudarJustificativa);

            document.getElementById('btnCopiarAssunto').addEventListener('click', () => copiarTextoPuro('resultadoAssunto'));
            document.getElementById('btnCopiarMensagem').addEventListener('click', () => copiarTextoRico('resultadoCorpo'));
            document.getElementById('btnCopiarCodProjeto').addEventListener('click', () => copiarValorInput('codProjeto', 'Código do projeto copiado!'));
            document.getElementById('btnCopiarCodContrato').addEventListener('click', () => copiarValorInput('codContratoPSA', 'Código do contrato copiado!'));

            document.getElementById('btnIndicadores').addEventListener('click', abrirIndicadores);
            document.getElementById('btnLimpar').addEventListener('click', limparFormulario);

            // ============================================================
            // --- LÓGICA DO MODAL DE STATUS ---
            // ============================================================
            const modalStatus = document.getElementById('modalStatus');
            const btnFecharModalStatus = document.getElementById('btnFecharModalStatus');
            const btnConfirmarStatusModal = document.getElementById('btnConfirmarStatusModal');
            const inputTicketModal = document.getElementById('inputTicketModal');

            // Abre o modal ao clicar no botão "Status"
            document.getElementById('btnCopiarStatus').addEventListener('click', () => {
                modalStatus.style.display = 'flex';
                inputTicketModal.value = formElements.ticket.value; 
                inputTicketModal.focus();
            });

            // Função para fechar o modal
            const fecharModalStatus = () => {
                modalStatus.style.display = 'none';
            };

            // Fecha no botão X
            btnFecharModalStatus.addEventListener('click', fecharModalStatus);

            // Fecha ao clicar fora da caixinha do modal
            modalStatus.addEventListener('click', (e) => {
                if (e.target === modalStatus) {
                    fecharModalStatus();
                }
            });

            // Lógica de copiar (com ou sem ticket) ao confirmar no modal
            btnConfirmarStatusModal.addEventListener('click', () => {
                const dataFormatada = new Intl.DateTimeFormat('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: '2-digit'
                }).format(new Date());
                
                const ticket = inputTicketModal.value.trim();
                
                // Atualiza o input original do formulário
                formElements.ticket.value = ticket;
                
                let txt = `${dataFormatada} - Faturamento Solicitado`;
                
                if (ticket) {
                    txt += ` - Ticket ${ticket}`;
                }
                
                navigator.clipboard.writeText(txt).then(() => {
                    mostrarToast(`"${txt}" copiado!`, true);
                    fecharModalStatus();
                });
            });

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            mudarJustificativa();
        });
    </script>
</body>
</html>
