<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Faturamento</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="image/x-icon" href="favicons/fat.ico">
</head>

<body>
    <header>
        <h1>Solicitação de <span class="azul-claro">Faturamento</span></h1>
    </header>

    <main class="container container-azul">

        <section class="container-formulario" id="formFaturamento">
            
            <div class="topo">
                <h2></h2>                
            </div>
            <br>

            <div class="input-group">
                <div class="input-item">
                    <label for="formatoSaida">Formato:</label>
                    <select id="formatoSaida">
                        <option value="Ticket" selected>Ticket</option>
                        <option value="Email">E-mail</option>
                    </select>
                </div>
            </div>
        
            <div class="input-group">
                <div class="input-item">
                    <label for="nomeProjeto">Nome do projeto:</label>
                    <input type="text" id="nomeProjeto" placeholder="">
                </div>
                <div class="input-item">
                    <label for="tipoAssunto">Assunto:</label>
                    <select id="tipoAssunto">
                        <option value="Faturamento">Solicitação de faturamento</option>
                        <option value="Projeto">Nome do projeto</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div class="input-item">
                    <label for="codProjeto">Cód. projeto:</label>
                    <input type="text" id="codProjeto" placeholder="Ex: D...001">
                </div>
                <div class="input-item">
                    <label for="codContratoPSA">Cód. contrato PSA:</label>
                    <input type="text" id="codContratoPSA" placeholder="Ex: D...">
                </div>
            </div>
        
            <div class="input-group">
                <div class="input-item">
                    <label for="codCliente">Cód. cliente:</label>
                    <input type="text" id="codCliente" placeholder="Ex: T...">
                </div>
                <div class="input-item">
                    <label for="valorLiquido">Valor líquido:</label>
                    <input type="text" id="valorLiquido" placeholder="Ex: R$...">
                </div>
            </div>
        
            <label for="tipoJustificativa">Justificativa:</label>
            <select id="tipoJustificativa">                
                <option value="Padrao">Termo de conclusão assinado</option>
                <option value="Unilateral">Faturamento unilateral</option>
                <option value="Outras">Outras (digitar abaixo)</option>
            </select>
        
            <div id="justificativaManualDiv" class="justificativa-manual hidden">
                <label for="justificativa">Digite sua Justificativa:</label>
                <input type="text" id="justificativa" placeholder="Descreva a justificativa aqui...">
            </div>
        </section>

        <section class="container-resultado">
            

            <div class="resultado">
                <button class="btn-azul btn-aux" id="btnCopiarAssunto">Copiar</button>
                <label>Assunto</label>
                <pre id="resultadoAssunto"></pre>
            </div>

            <div class="resultado">
                <button class="btn-azul btn-aux" id="btnCopiarMensagem">Copiar</button>
                <label>Mensagem</label>
                <pre id="resultadoCorpo"></pre>
            </div>
        </section>

        <section class="botoes-de-acao">
            <a style="text-decoration: none;" href="https://suporte.interno.totvs.io/hc/pt-br/requests/new?ticket_form_id=43090375254931&tf_43653456041107=peso_4&tf_43093105543571=CST_PMO+Local_Gest%C3%A3o+de+Projetos_Solicita%C3%A7%C3%A3o+de+Faturamento+-+Projeto&isLeaf=level4&tf_43093056156819=01KQMPRJP2AGE5BP7D362CCRW9&tf_undefined=portal_cst_brasil&pais=Brasil&tf_49875679614355=pais_brasil&level1=PMO+Local&level2=Gest%C3%A3o+de+Projetos&level3=Solicita%C3%A7%C3%A3o+de+Faturamento+-+Projeto"
            target="_blank"><button class="btn-roxo">Ticket</button></a>
            <button class="btn-roxo" id="btnCopiarStatus">Status</button>
            <button class="btn-verde" id="btnIndicadores">Indicadores</button>
            <button class="btn-laranja" id="btnLimpar">Limpar</button>
            

            <div id="toast">Copiado para a área de transferência!</div>
        </section>
    </main>  

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 1. CONFIGURAÇÕES INICIAIS ---
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // Constantes de Justificativa
        const JUSTIFICATIVA_PADRAO = "Termo de conclusão assinado no repositório do projeto.";
        const JUSTIFICATIVA_UNILATERAL = "Faturamento unilateral. Evidências de envio da MIT0062, há mais de 30 dias, disponível no repositório do fluig.";

        // Mapeamento de Elementos do DOM
        const formElements = {
            formatoSaida: document.getElementById('formatoSaida'),
            nomeProjeto: document.getElementById('nomeProjeto'),
            tipoAssunto: document.getElementById('tipoAssunto'),
            codProjeto: document.getElementById('codProjeto'),
            codContratoPSA: document.getElementById('codContratoPSA'),
            codCliente: document.getElementById('codCliente'),
            valorLiquido: document.getElementById('valorLiquido'),
            tipoJustificativa: document.getElementById('tipoJustificativa'),
            justificativa: document.getElementById('justificativa'),
            justificativaManualDiv: document.getElementById('justificativaManualDiv')
        };

        const resultElements = {
            assunto: document.getElementById('resultadoAssunto'),
            corpo: document.getElementById('resultadoCorpo')
        };


        // --- 2. FUNÇÕES DE LÓGICA E CONSTRUÇÃO ---
        const obterSaudacao = () => {
            const hora = parseInt(new Date().toLocaleString("en-US", {
                timeZone: "America/Sao_Paulo",
                hour: "numeric",
                hour12: false
            }), 10);

            if (hora >= 5 && hora < 12) return "bom dia";
            if (hora >= 12 && hora < 18) return "boa tarde";
            return "boa noite"; 
        };

        const preencherContrato = () => {
            const cod = formElements.codProjeto.value;
            if (cod.length > 3) {
                formElements.codContratoPSA.value = cod.slice(0, -3);
            } else if (cod.length === 0) {
                formElements.codContratoPSA.value = "";
            }
        };

        const mudarJustificativa = () => {
            const { tipoJustificativa, justificativa, justificativaManualDiv } = formElements;
            const tipo = tipoJustificativa.value;

            // Remove ou adiciona a classe .hidden para usar a regra CSS do style.css
            if (tipo === 'Selecione' || tipo === 'Padrao' || tipo === 'Unilateral') {
                justificativaManualDiv.style.display = 'none';
            } else {
                justificativaManualDiv.style.display = 'block';
            }

            // Preenche de acordo com o tipo
            if (tipo === 'Padrao') justificativa.value = JUSTIFICATIVA_PADRAO;
            else if (tipo === 'Unilateral') justificativa.value = JUSTIFICATIVA_UNILATERAL;
            else if (tipo === 'Outras') {
                if (justificativa.value === JUSTIFICATIVA_PADRAO || justificativa.value === JUSTIFICATIVA_UNILATERAL) {
                    justificativa.value = "";
                }
                justificativa.focus();
            } else {
                justificativa.value = "";
            }
            gerarEmail();
        };

        const gerarEmail = () => {
            const vals = {
                formato: formElements.formatoSaida.value,
                codProjeto: formElements.codProjeto.value.trim(),
                nomeProjeto: formElements.nomeProjeto.value.trim(),
                tipoAssunto: formElements.tipoAssunto.value,
                codContrato: formElements.codContratoPSA.value.trim(),
                codCliente: formElements.codCliente.value.trim(),
                justificativa: formElements.justificativa.value.trim(),
                tipoJustificativa: formElements.tipoJustificativa.value
            };

            let valorLiq = formElements.valorLiquido.value.trim();
            if (valorLiq && !valorLiq.toUpperCase().startsWith("R$")) {
                valorLiq = `R$ ${valorLiq}`; // Adicionado espaço para melhor UX "R$ 100,00"
            }

            // Define Assunto
            let assunto = '';
            if (vals.tipoAssunto === 'Faturamento') {
                assunto = vals.codProjeto ? `${vals.codProjeto} - Solicitação de Faturamento` : '';
            } else {
                assunto = (vals.codProjeto && vals.nomeProjeto) ? `${vals.codProjeto} - ${vals.nomeProjeto}` : '';
            }

            // REGRA NOVA: Adiciona "Unilateral" no assunto se o select for esse tipo e o assunto não estiver vazio
            if (vals.tipoJustificativa === 'Unilateral' && assunto !== '') {
                assunto += ' Unilateral';
            }

            // Define Corpo do Email
            let corpoEmail = "";
            if (vals.formato === 'Email') {
                corpoEmail += `Olá, ${obterSaudacao()}!\n\n`;
            }

            corpoEmail += `Favor proceder com o faturamento abaixo:\n\nCódigo do contrato PSA: ${vals.codContrato}\nCódigo do cliente: ${vals.codCliente}\nValor líquido: ${valorLiq}\n\nCódigo do projeto: ${vals.codProjeto}\nNome do projeto: ${vals.nomeProjeto}\n\nJustificativa: ${vals.justificativa}`;

            if (vals.formato === 'Email') {
                corpoEmail += `\n\nAtenciosamente,`;
            }

            // Renderiza
            resultElements.assunto.textContent = assunto;
            resultElements.corpo.innerHTML = corpoEmail.replace(/\n/g, '<br>');
        };


        // --- 3. FUNÇÕES DE UTILIDADE E FEEDBACK (TOAST / CLIPBOARD) ---
        const mostrarToast = (texto) => {
            const toast = document.getElementById("toast");
            let textoExibido = texto.length > 40 ? texto.substring(0, 40) + "..." : texto;
            
            toast.textContent = `"${textoExibido}" copiado!`;
            toast.className = "show";
            
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
        };

        const copiarTextoPuro = (idElemento) => {
            const texto = document.getElementById(idElemento).textContent;
            if (!texto.trim()) return;
            
            navigator.clipboard.writeText(texto).then(() => mostrarToast(texto))
                .catch(err => console.error('Erro ao copiar: ', err));
        };

        const copiarTextoRico = async (idElemento) => {
            const elemento = document.getElementById(idElemento);
            const html = elemento.innerHTML;
            const textoPuro = elemento.innerText;
            const htmlFormatado = `<div style="margin: 0 !important; padding: 0 !important; font-family: Arial, sans-serif;">${html}</div>`;

            try {
                const data = [new ClipboardItem({ 
                    "text/html": new Blob([htmlFormatado], { type: "text/html" }), 
                    "text/plain": new Blob([textoPuro], { type: "text/plain" }) 
                })];
                await navigator.clipboard.write(data);
                mostrarToast("Texto copiado!");
            } catch (err) {
                console.warn("ClipboardItem não suportado ou falhou. Usando fallback de texto puro...", err);
                copiarTextoPuro(idElemento); 
            }
        };

        const limparFormulario = () => {
            document.querySelectorAll('#formFaturamento input[type="text"]').forEach(input => input.value = '');
            formElements.formatoSaida.selectedIndex = 0;
            formElements.tipoAssunto.selectedIndex = 0;
            formElements.tipoJustificativa.selectedIndex = 0;
            mudarJustificativa();
        };

        const abrirIndicadores = () => {
            const codProjeto = formElements.codProjeto.value;
            const linkPlanilha = "https://docs.google.com/spreadsheets/d/19b-F8VDW_tJeJ2h4lM_owYeUDWt0upNsK_OR_bVe0aw/edit";

            navigator.clipboard.writeText(codProjeto).then(() => {
                mostrarToast(codProjeto || "Cód. Vazio");
                window.open(linkPlanilha, '_blank');
            }).catch(() => {
                window.open(linkPlanilha, '_blank');
            });
        };


        // --- 4. ATRIBUIÇÃO DOS EVENT LISTENERS ---
        // Inputs gerais que só precisam atualizar a visualização
        ['formatoSaida', 'nomeProjeto', 'tipoAssunto', 'codContratoPSA', 'codCliente', 'valorLiquido', 'justificativa'].forEach(id => {
            document.getElementById(id).addEventListener('input', gerarEmail);
        });

        // Cód. Projeto (Precisa preencher o PSA também)
        formElements.codProjeto.addEventListener('input', () => {
            preencherContrato();
            gerarEmail();
        });

        // Tipo Justificativa (Precisa validar o bloco manual)
        formElements.tipoJustificativa.addEventListener('change', mudarJustificativa);

        // Botões de Ação
        document.getElementById('btnCopiarAssunto').addEventListener('click', () => copiarTextoPuro('resultadoAssunto'));
        document.getElementById('btnCopiarMensagem').addEventListener('click', () => copiarTextoRico('resultadoCorpo'));
        
        document.getElementById('btnCopiarStatus').addEventListener('click', () => {
            // Gera a data atual no formato DD/MM/YY (ex: 21/07/26)
            const dataFormatada = new Intl.DateTimeFormat('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            }).format(new Date());
            
            // Monta o texto final
            const txt = `${dataFormatada} - Faturamento Solicitado`;
            
            // Copia para a área de transferência e mostra o toast
            navigator.clipboard.writeText(txt).then(() => mostrarToast(txt));
        });
        
        document.getElementById('btnIndicadores').addEventListener('click', abrirIndicadores);
        document.getElementById('btnLimpar').addEventListener('click', limparFormulario);


        // Inicializa o estado atual no primeiro carregamento
        mudarJustificativa();
    });
    </script>
</body>
</html>
